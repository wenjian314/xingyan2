name: Build APK (Stable)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Remove GHA bundled NDK (防干扰)
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk/27.3.13750724
          sudo rm -rf /usr/local/lib/android/sdk/ndk/29.0.14206865

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev \
            automake autopoint gettext python3-pip
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==3.0.11
          pip install buildozer==1.5.0
          pip install python-for-android==2024.01.21  # ✅ 锁定稳定版 p4a

      - name: Setup sdkmanager (旧路径兼容)
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          if [ ! -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -L -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip -d "$SDK_DIR/cmdline-tools/"
            mkdir -p "$SDK_DIR/cmdline-tools/latest"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools/"* "$SDK_DIR/cmdline-tools/latest/" 2>/dev/null || true
            rm -rf "$SDK_DIR/cmdline-tools/cmdline-tools"
          fi
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/avdmanager" "$SDK_DIR/tools/bin/avdmanager"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-28" "build-tools;28.0.3"

      - name: Force clean all
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer/android/platform/build-*
          buildozer android clean || true

      - name: Build APK (debug)
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export P4A_PYTHON_VERSION=3.11
          export P4A_BRANCH=stable  # ✅ 双重保险
          export CFLAGS="-isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          export CXXFLAGS="-isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 星言-APK
          path: |
            bin/*.apk
            .buildozer/bin/*.apk
          if-no-files-found: warn
