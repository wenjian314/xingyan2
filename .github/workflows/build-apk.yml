name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # ✅ 用 22.04 更稳，24.04 有些路径变化
    steps:
      - uses: actions/checkout@v4

      - name: Remove GHA bundled NDK (防污染)
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          sudo rm -rf /usr/local/lib/android/sdk/cmake/*

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            libffi-dev libssl-dev zlib1g-dev libbz2-dev libreadline-dev \
            libsqlite3-dev wget curl llvm libncurses5-dev libncursesw5-dev \
            xz-utils tk-dev openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Install Buildozer (不装 p4a！)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install cython==0.29.37  # ✅ Kivy 2.3.1 适配的 Cython
          pip install buildozer
          # ❌ 不装 python-for-android，让 buildozer 自己拉

      - name: Setup sdkmanager (旧路径兼容)
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          if [ ! -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -L -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip -d "$SDK_DIR/cmdline-tools/"
            mkdir -p "$SDK_DIR/cmdline-tools/latest"
            mv "$SDK_DIR/cmdline-tools/cmdline-tools/"* "$SDK_DIR/cmdline-tools/latest/" 2>/dev/null || true
            rm -rf "$SDK_DIR/cmdline-tools/cmdline-tools"
          fi
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/avdmanager" "$SDK_DIR/tools/bin/avdmanager"
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-28" "build-tools;28.0.3"

      - name: Clean (仅首次前清理，不删 p4a 目录)
        run: |
          rm -rf .buildozer
          # ❌ 不再 rm -rf ~/.buildozer/.../build-*
          # ❌ 不再 buildozer android clean（首次会误杀）

      - name: Build APK (debug)
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export P4A_PYTHON_VERSION=3.10
          export CFLAGS="-isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          export CXXFLAGS="-isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 星言-APK
          path: |
            bin/*.apk
            .buildozer/bin/*.apk
          if-no-files-found: warn
