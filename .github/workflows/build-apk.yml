name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Remove GHA bundled NDK (prevents NDK version conflict)
      run: |
        sudo rm -rf /usr/local/lib/android/sdk/ndk
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf automake libtool libltdl-dev \
          libffi-dev zlib1g-dev libssl-dev \
          python3-setuptools python3-pip python3-venv

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install "buildozer[full]" cython==0.29.36

    - name: Accept Android SDK licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Prepare icon
      run: |
        if [ ! -f "icon.png" ]; then
          python adaptive_icon.py
        fi
        ls -la icon.png

    - name: Force clean all Buildozer artifacts
      run: |
        rm -rf .buildozer
        rm -rf ~/.buildozer/android/platform/build-*
        buildozer android clean || true

    - name: Build APK (debug)
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        export P4A_PYTHON_VERSION=3.11
        export CFLAGS="-isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
        export CXXFLAGS="-isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: 星言-APK
        path: |
          bin/*.apk
          .buildozer/bin/*.apk
        if-no-files-found: warn
