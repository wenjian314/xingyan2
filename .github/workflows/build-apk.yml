name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install system dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libltdl-dev \
            libffi-dev zlib1g-dev libssl-dev \
            python3-setuptools python3-pip python3-venv

    - name: Install Buildozer
      run: |
          pip install --upgrade pip
          pip install "buildozer[full]" cython==0.29.36

    # ── 临时禁用缓存，强制全量重编（出包后可恢复）──
    # - name: Cache Buildozer downloads
    #   uses: actions/cache@v4
    #   with:
    #     path: |
    #       .buildozer/android/platform
    #       .buildozer/android/packages
    #     key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
    #     restore-keys: |
    #       ${{ runner.os }}-buildozer-

    - name: Accept Android SDK licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > ~/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
        echo "db158d2a12828de8a35f07cdd5a8a7a8e3d4c9a0" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Prepare icon
      run: |
        if [ ! -f "icon.png" ]; then
          python adaptive_icon.py
        fi
        ls -la icon.png

    - name: Fix sdkmanager path
      run: |
          SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
          mkdir -p $SDK_DIR/cmdline-tools
          if [ ! -f $SDK_DIR/cmdline-tools/latest/bin/sdkmanager ]; then
            curl -L -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip -d $SDK_DIR/cmdline-tools/
            mkdir -p $SDK_DIR/cmdline-tools/latest
            mv $SDK_DIR/cmdline-tools/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/ 2>/dev/null || true
            rm -rf $SDK_DIR/cmdline-tools/cmdline-tools
          fi
          mkdir -p $SDK_DIR/tools/bin
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/avdmanager $SDK_DIR/tools/bin/avdmanager
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3"

    - name: Clean Buildozer (Force full rebuild)
      run: |
          rm -rf .buildozer/android/packages
          rm -rf .buildozer/android/platform/build-arm64-v8a
          buildozer android clean || true

    - name: Build APK (debug)
      run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export P4A_PYTHON_VERSION=3.9
          export P4A_BRANCH=master
          export CFLAGS="-isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          export CXXFLAGS="-isystem /usr/include/x86_64-linux-gnu -isystem /usr/include"
          buildozer -v android debug

    - name: Find and rename APK
      run: |
          find . -name "*.apk" -not -path "*/.buildozer/*" 2>/dev/null || true
          find .buildozer -name "*.apk" 2>/dev/null || true
          cp bin/*.apk "星言_v1.0.0.apk" 2>/dev/null || cp .buildozer/bin/*.apk "星言_v1.0.0.apk" 2>/dev/null || true
          ls -la 星言_v1.0.0.apk 2>/dev/null || echo "APK not found in expected locations"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
          name: 星言-APK
          path: |
            bin/*.apk
            .buildozer/bin/*.apk
          if-no-files-found: warn

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          星言_v1.0.0.apk
          bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
