name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libltdl-dev \
            zlib1g-dev libssl-dev libffi-dev \
            libssl-dev libsqlite3-dev libreadline-dev \
            libbz2-dev liblzma-dev python3-setuptools python3-pip python3-venv \
            libxml2-dev libxslt1-dev libjpeg-dev libpng-dev libfreetype6-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            gstreamer1.0-dev gstreamer1.0-plugins-base

    - name: Install Buildozer
      run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

    - name: Cache Buildozer downloads
      uses: actions/cache@v4
      with:
        path: |
          .buildozer/android/platform
          .buildozer/android/packages
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Accept Android SDK licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Prepare icon
      run: |
        # 确保图标存在
        if [ ! -f "icon.png" ]; then
          python adaptive_icon.py
        fi
        ls -la icon.png
    - name: Fix sdkmanager path
      run: |
          SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
          mkdir -p $SDK_DIR/cmdline-tools
          # 下载并解压新版 cmdline-tools (若未存在)
          if [ ! -f $SDK_DIR/cmdline-tools/latest/bin/sdkmanager ]; then
            curl -L -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip -d $SDK_DIR/cmdline-tools/
            mkdir -p $SDK_DIR/cmdline-tools/latest
            mv $SDK_DIR/cmdline-tools/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/ 2>/dev/null || true
            rm -rf $SDK_DIR/cmdline-tools/cmdline-tools
          fi
          # 创建旧路径软链接，兼容 Buildozer 查找逻辑
          mkdir -p $SDK_DIR/tools/bin
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/avdmanager $SDK_DIR/tools/bin/avdmanager
          # 接受协议并安装基础工具
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3" || true
    
    - name: Build APK (debug)
      run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          export P4A_PYTHON_VERSION=3.10
          export P4A_BRANCH=master
          buildozer android debug

    - name: Find and rename APK
      run: |
          find . -name "*.apk" -not -path "*/.buildozer/*" 2>/dev/null || true
          find .buildozer -name "*.apk" 2>/dev/null || true
          # 复制到已知位置
          cp bin/*.apk "星言_v1.0.0.apk" 2>/dev/null || cp .buildozer/bin/*.apk "星言_v1.0.0.apk" 2>/dev/null || true
          ls -la 星言_v1.0.0.apk 2>/dev/null || echo "APK not found in expected locations"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
          name: 星言-APK
          path: |
            bin/*.apk
            .buildozer/bin/*.apk
            if-no-files-found: warn

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          星言_v1.0.0.apk
          bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
