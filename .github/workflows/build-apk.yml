name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev \
          libssl-dev libffi-dev \
          libsqlite3-dev libreadline-dev \
          libbz2-dev liblzma-dev \
          python3-setuptools python3-pip python3-venv \
          libxml2-dev libxslt1-dev \
          libjpeg-dev libpng-dev libfreetype6-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          libgstreamer1.0-dev gstreamer1.0-plugins-base \
          libgstreamer-plugins-base1.0-dev

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36

    - name: Cache Buildozer downloads
      uses: actions/cache@v4
      with:
        path: |
          .buildozer/android/platform
          .buildozer/android/packages
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Accept Android SDK licenses
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Prepare icon
      run: |
        # 确保图标存在
        if [ ! -f "icon.png" ]; then
          python adaptive_icon.py
        fi
        ls -la icon.png

    - name: Build APK (debug)
      run: |
        buildozer android debug

    - name: Find and rename APK
      run: |
        find . -name "*.apk" -not -path "*/.buildozer/*" 2>/dev/null || true
        find .buildozer -name "*.apk" 2>/dev/null || true
        # Copy to a known location
        cp bin/*.apk "星言_v1.0.0.apk" 2>/dev/null || cp .buildozer/bin/*.apk "星言_v1.0.0.apk" 2>/dev/null || true
        ls -la 星言_v1.0.0.apk 2>/dev/null || echo "APK not found in expected locations"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: 星言-APK
        path: |
          bin/*.apk
          星言_v1.0.0.apk
          .buildozer/bin/*.apk
        if-no-files-found: warn

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          星言_v1.0.0.apk
          bin/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
